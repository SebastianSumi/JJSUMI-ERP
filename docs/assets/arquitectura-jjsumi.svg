<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560">
  <rect width="1100" height="560" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <text x="550" y="44" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#0B1628">Arquitectura de Integración JJSUMI (AWS Ubuntu 24.04)</text>

  <!-- Nginx Gateway -->
  <rect x="330" y="70" width="440" height="72" rx="12" fill="#101F3A"/>
  <text x="550" y="102" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Nginx Reverse Proxy (Puerto 80)</text>
  <text x="550" y="126" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#C9A227">/bsc/ (Estático)  ·  /bsc-api/ (:3000)  ·  / (n8n :5678)</text>

  <!-- Odoo 19 -->
  <rect x="60" y="205" width="300" height="170" rx="12" fill="#FFFFFF" stroke="#16845b" stroke-width="2.5"/>
  <rect x="60" y="205" width="300" height="40" rx="10" fill="#16845b"/>
  <text x="210" y="231" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Odoo 19 Community (:8069)</text>
  <text x="80" y="272" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1D2939">• Finanzas (l10n_pe) &amp; jjsumi_reniec</text>
  <text x="80" y="296" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1D2939">• Compras 3-vías &amp; Inventario</text>
  <text x="80" y="320" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1D2939">• jjsumi_bsc_sync (Tiempo real)</text>
  <text x="80" y="344" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1D2939">• jjsumi_n8n + SSO JWT</text>

  <!-- BSC -->
  <rect x="740" y="205" width="300" height="170" rx="12" fill="#FFFFFF" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="740" y="205" width="300" height="40" rx="10" fill="#2563eb"/>
  <text x="890" y="231" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">BSC Backend + UI (:3000)</text>
  <text x="760" y="272" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1D2939">• NestJS 12 + Prisma 6</text>
  <text x="760" y="296" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1D2939">• React 19 + Tailwind (/var/www/bsc)</text>
  <text x="760" y="320" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1D2939">• Finanzas &amp; SUNAT (K14–K20)</text>
  <text x="760" y="344" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1D2939">• Alertas ODOO_SYNC + SyncOdooLog</text>

  <!-- n8n -->
  <rect x="400" y="235" width="300" height="140" rx="12" fill="#FFFFFF" stroke="#b97708" stroke-width="2.5"/>
  <rect x="400" y="235" width="300" height="40" rx="10" fill="#b97708"/>
  <text x="550" y="261" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">n8n Automation (:5678)</text>
  <text x="420" y="302" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1D2939">• Webhook Eventos (7 rutas)</text>
  <text x="420" y="326" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1D2939">• Cierre Diario 23:00 (SMTP)</text>
  <text x="420" y="350" font-family="Inter, Arial, sans-serif" font-size="13" fill="#1D2939">• Monitor Alertas cada 6h</text>

  <!-- PostgreSQL & SQLite -->
  <rect x="180" y="435" width="740" height="78" rx="12" fill="#0B1628"/>
  <text x="550" y="468" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Capa de Datos: PostgreSQL 16 (jjsumi + bsc_techperu) &amp; SQLite (n8n)</text>
  <text x="550" y="492" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#CBD5E1">Puerto 5432 (127.0.0.1)  ·  /home/ubuntu/.n8n/database.sqlite</text>

  <!-- Arrows -->
  <g stroke="#334155" stroke-width="2.2" fill="none">
    <line x1="550" y1="142" x2="550" y2="235"/>
    <line x1="650" y1="142" x2="890" y2="205"/>
    <line x1="360" y1="290" x2="400" y2="290"/>
    <line x1="700" y1="290" x2="740" y2="290"/>
    <path d="M 210 205 L 210 180 L 890 180 L 890 205"/>
    <line x1="210" y1="375" x2="260" y2="435"/>
    <line x1="550" y1="375" x2="550" y2="435"/>
    <line x1="890" y1="375" x2="840" y2="435"/>
  </g>
  <text x="550" y="172" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#16845b">POST /bsc/sync-odoo (x-jjsumi-secret)</text>
</svg>
